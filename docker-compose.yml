services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # credentials come from .env (compose reads it automatically);
    # no ports: section on purpose - only the app network reaches the DB.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-github_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-github_agent}
      POSTGRES_DB: github_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-github_agent}:${POSTGRES_PASSWORD:-github_agent}@postgres:5432/github_agent
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # OAuth callback must be a URL GitHub can reach; 127.0.0.1 only works
      # when you also publish the app publicly and register that URL.
      GITHUB_REDIRECT_URI: http://127.0.0.1:8000/auth/github/callback
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
  app_logs:
  redis_data:
