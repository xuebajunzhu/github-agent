name: Nightly Evolution (GitHub-hosted training)

# Uses GitHub's compute to run one bounded self-evolution cycle per night:
# collect fresh data -> train a challenger -> golden-gate it -> if it passes,
# publish the model as a Release asset. The local deployment pulls releases
# via scripts/pull_model_release.py (canary + gates still apply locally).

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r training/requirements-training.txt
      - name: Restore accumulated dataset from repo releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download dataset -p "raw_repos_all.jsonl" -D training/data/ --clobber \
            || echo "no stored dataset yet; starting fresh"

      - name: Collect fresh training data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python training/collect_data.py \
            --output training/data/raw_repos_ci.jsonl \
            --min-stars 50 --per-page 100 --sleep 2

      - name: Build dataset and train challenger
        run: |
          cat training/data/raw_repos_ci.jsonl >> training/data/raw_repos_all.jsonl
          python training/prepare_data.py --raw training/data/raw_repos_all.jsonl --max-samples 12000
          python training/train.py --epochs 1 --model-dir models/staging-ci
          python training/retune_thresholds.py --model-dir models/staging-ci

      - name: Golden-set gate (a rejected challenger is a normal outcome)
        env:
          TRAINED_MODEL_PATH: models/staging-ci
        continue-on-error: true
        run: python training/golden_eval.py

      - name: Store refreshed dataset back to repo releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload dataset training/data/raw_repos_all.jsonl --clobber \
            || gh release create dataset training/data/raw_repos_all.jsonl \
                 --title "accumulated training dataset" --notes "weak-labeled repo records"
      - name: Read gate outcome
        id: gate
        run: |
          PASSED=$(python -c "import json;print(json.load(open('models/staging-ci/golden_eval_report.json'))['gates_passed'])")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          if [ "$PASSED" != "True" ]; then
            echo "Challenger rejected by golden gates - no release will be published (normal)."
          fi

      - name: Package model
        if: steps.gate.outputs.passed == 'True'
        run: tar -czf model.tar.gz -C models staging-ci
      - name: Publish model release
        if: steps.gate.outputs.passed == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-${{ github.run_id }}
          name: model-${{ github.run_id }}
          body: "Challenger passed the golden gates on GitHub-hosted training."
          files: model.tar.gz
