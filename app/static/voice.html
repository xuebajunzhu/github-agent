<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Agent · 语音找项目</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .mic-wrap { position: relative; margin-bottom: 20px; }
  .mic {
    width: 120px; height: 120px; border-radius: 50%;
    border: 4px solid #38bdf8; background: #1e293b;
    font-size: 48px; cursor: pointer;
    transition: all .2s ease;
  }
  .mic:hover { transform: scale(1.05); }
  .mic.recording {
    border-color: #f87171; background: #7f1d1d;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(248,113,113,.5); }
    70% { box-shadow: 0 0 0 28px rgba(248,113,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); }
  }
  .status { min-height: 24px; color: #94a3b8; font-size: 15px; margin-bottom: 24px; }
  .status .query { color: #38bdf8; font-weight: 600; }
  .card {
    width: 100%; max-width: 640px;
    background: rgba(30,41,59,.8); border: 1px solid #334155;
    border-radius: 12px; padding: 16px 20px; margin-bottom: 14px;
  }
  .card .name { color: #38bdf8; font-weight: 600; font-size: 16px; }
  .card .name a { color: inherit; text-decoration: none; }
  .card .name a:hover { text-decoration: underline; }
  .card .score { float: right; color: #4ade80; font-size: 13px; }
  .card .summary { color: #cbd5e1; font-size: 14px; margin: 8px 0; line-height: 1.5; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: #334155; color: #94a3b8; border-radius: 10px;
    font-size: 12px; padding: 2px 10px;
  }
  .deps { color: #fbbf24; font-size: 12px; margin-top: 8px; }
  audio { width: 100%; max-width: 640px; margin-top: 10px; }
  .error { color: #f87171; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>🎙️ GitHub Agent · 语音找开源项目</h1>
<div class="subtitle">说出你的场景，例如「我需要一个终端文件管理器」，全部离线处理</div>

<div class="mic-wrap">
  <button id="mic" class="mic" title="点击开始/结束录音">🎤</button>
</div>
<div class="status" id="status">点击麦克风开始说话</div>
<audio id="replyAudio" class="hidden" controls></audio>
<div id="results"></div>

<script>
const micBtn = document.getElementById("mic");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const audioEl = document.getElementById("replyAudio");
let mediaRecorder = null;
let chunks = [];
let recording = false;

micBtn.addEventListener("click", async () => {
  if (recording) { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      submit(new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" }));
    };
    mediaRecorder.start();
    recording = true;
    micBtn.classList.add("recording");
    statusEl.textContent = "正在录音…再说一次麦克风结束";
  } catch (err) {
    statusEl.innerHTML = '<span class="error">无法访问麦克风：' + err.message + "</span>";
  }
});

async function submit(blob) {
  recording = false;
  micBtn.classList.remove("recording");
  statusEl.textContent = "识别中…（离线 whisper，约几秒）";
  resultsEl.innerHTML = "";
  const form = new FormData();
  form.append("file", blob, "query.webm");
  try {
    const resp = await fetch("/api/voice/ask", { method: "POST", body: form });
    if (!resp.ok) {
      const detail = (await resp.json()).detail || resp.statusText;
      throw new Error(detail);
    }
    const data = await resp.json();
    statusEl.innerHTML = '你问：<span class="query">' + escapeHtml(data.query) + "</span>";
    renderResults(data.results);
    const audioBytes = Uint8Array.from(atob(data.audio_base64), c => c.charCodeAt(0));
    audioEl.src = URL.createObjectURL(new Blob([audioBytes], { type: "audio/wav" }));
    audioEl.classList.remove("hidden");
    audioEl.play().catch(() => {});
  } catch (err) {
    statusEl.innerHTML = '<span class="error">' + escapeHtml(err.message) + "</span>";
  }
}

function renderResults(results) {
  resultsEl.innerHTML = "";
  results.forEach(item => {
    const p = item.project;
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML =
      '<div class="name"><a href="' + p.url + '" target="_blank">' + escapeHtml(p.full_name) + "</a>" +
      '<span class="score">★ ' + p.stars + " · 匹配 " + Math.round(item.score * 100) + "%</span></div>" +
      '<div class="summary">' + escapeHtml(p.ai_summary || p.description || "") + "</div>" +
      '<div class="tags">' + (p.ai_tags || []).slice(0, 6).map(t => '<span class="tag">' + escapeHtml(t) + "</span>").join("") + "</div>" +
      (item.dependencies && item.dependencies.length ? '<div class="deps">依赖: ' + escapeHtml(item.dependencies.join(", ")) + "</div>" : "");
    resultsEl.appendChild(div);
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
