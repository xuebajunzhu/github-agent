services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: github_agent
      POSTGRES_PASSWORD: github_agent
      POSTGRES_DB: github_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://github_agent:github_agent@postgres:5432/github_agent
      GITHUB_REDIRECT_URI: http://127.0.0.1:8000/auth/github/callback
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
